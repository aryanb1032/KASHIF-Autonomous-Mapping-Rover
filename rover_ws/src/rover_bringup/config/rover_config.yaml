base_bridge:
  ros__parameters:
    port: /dev/rover_esp32
    baud: 115200
    wheel_radius: 0.05
    track_width: 0.32
    encoder_ticks_per_wheel_rev: 1680.0
    hardware_calibrated: false
    imu_gyro_z_bias: 0.0
sllidar_node:
  ros__parameters:
    channel_type: serial
    serial_port: /dev/rplidar
    serial_baudrate: 115200
    frame_id: laser_link
    inverted: false
    angle_compensate: true
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.2
    transform_publish_period: 0.02
    map_update_interval: 2.0
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    solver_plugin: solver_plugins::CeresSolver
    scan_queue_size: 1
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
